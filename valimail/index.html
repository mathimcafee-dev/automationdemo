.inl{margin-top:10px;padding:12px;background:var(--row);border-radius:6px;display:flex;flex-direction:column;gap:10px}.ib{display:flex;gap:8px;flex-wrap:wrap}
.sugs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chip{min-height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--blue-100);background:#fff;color:var(--blue-d);font-weight:600;font-size:13px;cursor:pointer}.chip:hover{border-color:var(--blue)}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.sform{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--row)}
.sform .span2{grid-column:span 2}select.inp{appearance:auto}
.mtag{display:inline-block;font-size:11px;font-weight:600;color:var(--blue-d);background:var(--blue-50);border:1px solid var(--blue-100);border-radius:4px;padding:0 5px;margin-right:4px;vertical-align:1px}
td.lt{color:var(--red);font-weight:600}.muted{color:var(--muted)}
.inp:disabled{background:var(--row);color:var(--muted)}
@media (max-width:1100px){.mgrid{grid-template-columns:1fr}.sform{grid-template-columns:1fr 1fr}.up{grid-template-columns:52px 1fr}.upa{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center}}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))!important}.dgrid{grid-template-columns:1fr}.sgrid{grid-template-columns:1fr}.sg{border-right:0;border-bottom:1px solid var(--line)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:640px){.wrap,.bar .in{padding-left:14px;padding-right:14px}.head h1{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const SCOL={d:'#0174C3',o:'#C8102E',n:'#D5DCE6',b:'#C8102E',ok:'#5FA8E0',done:'#0B7A4B'};

function rmetrics(){const ps=xrows(),n=ps.length||1;const cells=ps.length*5;const done=ps.reduce((a,p)=>a+STAGES.filter((x,i)=>isDone(p,i)).length,0);

 return`<div style="display:flex;align-items:center;gap:18px"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Partner status breakdown"><circle r="${R}" cx="70" cy="70" fill="none" stroke="#EEF2F7" stroke-width="18"/>${arcs}<text x="70" y="66" text-anchor="middle" font-size="26" font-weight="700" fill="#0B2447">${M.pct}%</text><text x="70" y="86" text-anchor="middle" font-size="10.5" fill="#51607A">steps done</text></svg>

function rstagebars(M){const n=M.ps.length||1;return STAGES.map((st,i)=>{const d=M.ps.filter(p=>isDone(p,i)).length,o=M.ps.filter(p=>overdue(p,i)).length,r=M.ps.length-d-o;

 ${M.ps.map(p=>{const pc=pct(p);return`<tr><td class="nm">${esc(p.name)}${extra.includes('pid')&&p.pid?`<div style="font-weight:400;color:#7A879C;font-size:10.5px">ID ${p.pid}</div>`:''}</td>${STAGES.map((st,i)=>{const d=p.s[st.k];if(d.done)return`<td class="d">✓ ${st.yes}${XO.dates&&d.date?`<div style="font-weight:400;font-size:10.5px;opacity:.85">${mon(d.date)} ${dom(d.date)}</div>`:''}</td>`;const od=overdue(p,i);if(od)return`<td class="o">${st.no}<div style="font-weight:500;font-size:10.5px">${od} days late</div></td>`;const dd=stageDue(p,i);return`<td class="n">${st.no}${dd?`<div style="font-size:10.5px">due ${mon(dd)} ${dom(dd)}</div>`:''}</td>`}).join('')}
 <td class="c"><b>${pc}%</b><div class="pb"><i style="width:${pc}%"></i></div></td><td class="c">${(()=>{const v=xstatus(p);return`<span class="r-st ${v==='Complete'?'done':v==='On track'?'ok':'bad'}">${v}</span>`})()}${p.blocked&&extra.includes('block')?`<div style="font-size:10.5px;color:#C8102E;margin-top:3px">${esc(p.block)}</div>`:''}</td>

function rtimeline(M){const pts=[];M.ps.forEach(p=>{STAGES.forEach((st,i)=>{const d=p.s[st.k];if(d.done&&d.date)pts.push(d.date);const dd=stageDue(p,i);if(dd)pts.push(dd)});planned(p).forEach(m=>pts.push(m.d))});
 pts.push(today());let lo=pts.reduce((a,b)=>a<b?a:b),hi=pts.reduce((a,b)=>a>b?a:b);lo=addTo(lo,-3);hi=addTo(hi,4);if(rdays(lo,hi)<21)hi=addTo(lo,21);
 const W=1000,L=130,R=20,rowH=34,top=26,H=top+M.ps.length*rowH+10,span=rdays(lo,hi),x=d=>L+(W-L-R)*rdays(lo,d)/span;
 let ticks='';for(let k=0;k<=span;k+=Math.max(1,Math.round(span/10))){const d=addTo(lo,k);ticks+=`<line x1="${x(d)}" x2="${x(d)}" y1="${top-6}" y2="${H-6}" stroke="#EEF2F7"/><text x="${x(d)}" y="14" font-size="10" fill="#7A879C" text-anchor="middle">${mon(d)} ${dom(d)}</text>`}

  const first=dn[0]?.d.date,last=dn[dn.length-1]?.d.date;let g=`<text x="0" y="${y+4}" font-size="11.5" font-weight="700" fill="#14213D">${esc(p.name)}</text><line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#F1F4F8" stroke-width="10" stroke-linecap="round"/>`;

document.addEventListener('click',e=>{const t=e.target.closest('[data-row],[data-a]');if(!t)return;
 if(t.dataset.row&&!e.target.closest('.drow')){if(t.dataset.go){OPEN=t.dataset.row;render();document.querySelector(`tr.prow[data-row="${OPEN}"]`)?.scrollIntoView({block:'start',behavior:'smooth'});return}OPEN=OPEN===t.dataset.row?null:t.dataset.row;EXP=null;const y=window.scrollY;render();window.scrollTo(0,y);return}
 const a0=t.dataset.a;
 if(['ctog','cyes','cno','cedit','csave','cclose'].includes(a0)){const q=P(t.dataset.p||(CED&&CED.p));const k=t.dataset.k||(CED&&CED.k);const y0=window.scrollY;
  if(a0==='cclose'){CED=null;render();window.scrollTo(0,y0);return}
  const x=CITEMS.find(z=>z.k===k);const c=cinit(q)[k];
  if(a0==='cedit'){CED={p:q.id,k};render();window.scrollTo(0,y0);setTimeout(()=>document.getElementById('ced-in')?.focus(),20);return}
  if(a0==='csave'){const raw=document.getElementById('ced-in').value;const u=safeUrl(raw);if(raw.trim()&&!u){toast('That link does not look right. Check it and try again.');return}if(x.url&&!x.opt&&!u){toast('Add the page link to mark the website live');return}
   const was=c.done;c.url=u;if(!c.done){c.done=true;c.date=today()}CED=null;log(q,`${x.t}: ${was?'link updated':x.yes.toLowerCase()}${u?' ('+u+')':''}`);render();window.scrollTo(0,y0);toast(`${q.name}: ${x.t} ${was?'link saved':x.yes.toLowerCase()}`);return}
  if(a0==='ctog'){if(!c.done&&x.url&&!c.url){CED={p:q.id,k};render();window.scrollTo(0,y0);setTimeout(()=>document.getElementById('ced-in')?.focus(),20);return}c.done=!c.done;c.date=c.done?today():'';log(q,`${x.t}: ${(c.done?x.yes:x.no).toLowerCase()}`);render();window.scrollTo(0,y0);toast(`${q.name}: ${x.t} ${(c.done?x.yes:x.no).toLowerCase()}`);return}
  if(a0==='cyes'){c.done=true;c.date=today();log(q,`${x.t}: ${x.yes.toLowerCase()}`);render();window.scrollTo(0,y0);toast(`${q.name}: ${x.t} ${x.yes.toLowerCase()}`);return}
  if(a0==='cno'){if(!confirm(`Set ${x.t} to ${x.no.toLowerCase()} for ${q.name}?`))return;c.done=false;c.date='';log(q,`${x.t}: ${x.no.toLowerCase()}`);render();window.scrollTo(0,y0);return}}
 if(a0==='tog'||a0==='set'){const q=P(t.dataset.p||OPEN);if(!q)return;const i=+t.dataset.i,st=STAGES[i],cur=q.s[st.k];const v=a0==='tog'?!cur.done:t.dataset.v==='1';if(v===!!cur.done)return;
  const before=stageOf(q);cur.done=v;cur.date=v?today():'';DRAFT=null;q.dueManual=false;refreshDue(q);if(!planned(q).length&&/^Schedule/i.test(q.next)&&stageOf(q)!==before){q.next=live(q)?'Schedule a check-in':'Schedule the '+suggest(q)[0].t.toLowerCase()}refreshDue(q);log(q,`${st.t}: ${(v?st.yes:st.no).toLowerCase()}`);const after=stageOf(q);const y=window.scrollY;render();window.scrollTo(0,y);
  toast(after===5?q.name+': all steps complete':`${q.name}: ${st.t} ${(v?st.yes:st.no).toLowerCase()}`);return}
 const p=P(OPEN),a=t.dataset.a;
 const rr=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};
 if(a==='mtype'&&p){DRAFT=Object.assign(draftFor(p,t.dataset.t),{pid:p.id,d:DRAFT.d,time:DRAFT.time,fmt:DRAFT.fmt,who:DRAFT.who});rr();document.getElementById('ms-d')?.focus();return}
 if(a==='autodue'&&p){p.dueManual=false;refreshDue(p);log(p,'due date set to automatic');rr();toast('Due date updated');return}
 if(a==='mmore'){document.getElementById('ms-type')?.focus();return}
 if(a==='msched'&&p){if(!DRAFT.t.trim()){toast('Add a title for the meeting');document.getElementById('ms-t').focus();return}if(!DRAFT.d){toast('Choose a date');document.getElementById('ms-d').focus();return}
  const m={id:'m'+Date.now(),type:DRAFT.type,t:DRAFT.t.trim(),d:DRAFT.d,time:DRAFT.time,fmt:DRAFT.fmt,who:DRAFT.who.trim(),agenda:DRAFT.agenda.trim(),status:'planned'};p.meetings.push(m);syncNext(p);
  log(p,`scheduled ${m.t} for ${dlong(m.d)}${m.time?', '+t12(m.time):''}`);DRAFT=null;rr();toast('Meeting scheduled');return}
 if(a==='mexp'){EXP={id:t.dataset.m,mode:t.dataset.mode};rr();setTimeout(()=>document.getElementById((EXP.mode==='done'?'oc-':'rd-')+EXP.id)?.focus(),30);return}
 if(a==='mclose'){EXP=null;rr();return}
 if(a==='mdone'&&p){const m=p.meetings.find(x=>x.id===t.dataset.m);if(!m)return;m.status='done';m.n=(document.getElementById('oc-'+m.id)?.value||'').trim();const x=mt(m.type);const tk=document.getElementById('tk-'+m.id);const before=stageOf(p);
  if(x.tick!==null&&tk&&tk.checked){const k=STAGES[x.tick].k;p.s[k].done=true;p.s[k].date=m.d}p.dueManual=false;syncNext(p);refreshDue(p);EXP=null;log(p,`completed ${m.t}`+(m.n?`: ${m.n}`:''));const after=stageOf(p);rr();toast(after!==before?(after===5?p.name+': all steps complete':p.name+': next is '+STAGES[after].t.toLowerCase()):'Meeting marked done');return}
 if(a==='mmove'&&p){const m=p.meetings.find(x=>x.id===t.dataset.m);const nd=document.getElementById('rd-'+m.id).value,nt=document.getElementById('rt-'+m.id).value;if(!nd){toast('Choose a date');return}m.d=nd;m.time=nt;syncNext(p);EXP=null;log(p,`rescheduled ${m.t} to ${dlong(nd)}${nt?', '+t12(nt):''}`);rr();toast('Meeting rescheduled');return}
 if(a==='mcancel'&&p){const m=p.meetings.find(x=>x.id===t.dataset.m);if(!confirm('Cancel '+m.t+'?'))return;m.status='cancelled';syncNext(p);log(p,'cancelled '+m.t);rr();toast('Meeting cancelled');return}
 if(a==='ics'&&p){const m=p.meetings.find(x=>x.id===t.dataset.m);const blob=new Blob([icsFor(p,m)],{type:'text/calendar'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=(p.name+' '+m.t).replace(/[^\w]+/g,'-')+'.ics';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
 if(a==='block'&&p){p.blocked=!p.blocked;if(!p.blocked){p.block='';log(p,'blocker cleared')}else log(p,'marked as blocked');rerender();if(p.blocked)setTimeout(()=>document.getElementById('bl')?.focus(),30)}
 else if(a==='copy'){xopen()}
 else if(a==='pinfo'&&p){INFO=INFO===p.id?null:p.id;const y=window.scrollY;render();window.scrollTo(0,y);if(INFO)setTimeout(()=>document.getElementById(p.pid?'pi-contact':'pi-pid')?.focus(),30)}
 else if(a==='bview'){BV=t.dataset.b;try{localStorage.setItem('valimail-batch',BV)}catch(x){}OPEN=null;render()}
 else if(a==='signout'){localStorage.removeItem('valimail-auth');location.reload()}});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='ced-in'){if(e.key==='Enter'){e.preventDefault();document.querySelector('[data-a="csave"]')?.click()}if(e.key==='Escape'){CED=null;render()}return}if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr.prow')){e.preventDefault();OPEN=OPEN===e.target.dataset.row?null:e.target.dataset.row;render()}});

 if(t.dataset.sd!==undefined){const st=STAGES[+t.dataset.sd];p.s[st.k].date=t.value;refreshDue(p);log(p,`${st.t} date set to ${t.value?dlong(t.value):'none'}`);const y=window.scrollY;render();window.scrollTo(0,y);toast('Saved');return}
 if(t.dataset.dr){DRAFT[t.dataset.dr]=t.value;if(t.dataset.dr==='type'){const x=mt(t.value);if(!DRAFT.t||MTYPES.some(y=>y.t===DRAFT.t))DRAFT.t=x.t==='Other'?'':x.t;if(!DRAFT.agenda||MTYPES.some(y=>y.d===DRAFT.agenda))DRAFT.agenda=x.t==='Other'?'':x.d;const y=window.scrollY;render();window.scrollTo(0,y)}return}
 if(t.dataset.i!==undefined&&t.type==='checkbox'){const i=+t.dataset.i,j=+t.dataset.j,before=stageOf(p);p.checks[i][j]=t.checked;log(p,(t.checked?'done: ':'reopened: ')+STAGES[i].items[j].charAt(0).toLowerCase()+STAGES[i].items[j].slice(1));const after=stageOf(p);const y=window.scrollY;render();window.scrollTo(0,y);document.querySelector(`input[data-i="${i}"][data-j="${j}"]`)?.focus();if(after!==before)toast(after===5?p.name+' is onboarded and live':p.name+' moved to '+STAGES[after].t);return}
 if(t.dataset.pi){p[t.dataset.pi]=t.value.trim();log(p,'partner details updated');toast('Saved');return}
 if(t.dataset.k){const k=t.dataset.k;p[k]=t.value||(k==='due'?today():'');if(k==='due')p.dueManual=true;log(p,{next:'next action updated',due:'due date changed',block:'blocker updated',notes:'notes updated'}[k]);const y=window.scrollY;render();window.scrollTo(0,y);toast('Saved')}});
