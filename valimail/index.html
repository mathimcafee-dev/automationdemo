<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DMARC Essentials Partner Launch Tracker</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect x=%2230%22 y=%2210%22 width=%2240%22 height=%2280%22 rx=%228%22 fill=%22%230174C3%22/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--blue:#0174C3;--blue-d:#005A99;--navy:#0B2447;--blue-50:#EEF6FD;--blue-100:#D6EAF9;--ink:#14213D;--muted:#51607A;--line:#DDE3EC;--row:#F7F9FC;--bg:#FFFFFF;
--red:#C8102E;--red-50:#FDECEF;--green:#0B7A4B;--green-50:#E7F6EF;--off:#C4CCD8;--ease:cubic-bezier(.2,.7,.2,1);--fast:150ms;
--font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
--c:var(--blue);--t:var(--blue-50);--c-bb:var(--blue);--t-bb:var(--blue-50)}
html{overflow-x:hidden;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.bar{background:var(--navy);color:#fff}
.bar .in{max-width:1400px;margin:0 auto;padding:0 28px;min-height:60px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}.brand i{width:10px;height:26px;border-radius:2px;background:var(--blue)}
.brand small{font-weight:400;color:#A9B8D3;font-size:14px;margin-left:4px}
.bar .r{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13.5px;color:#C9D4E8;flex-wrap:wrap}
.bar button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;min-height:34px;padding:0 12px;cursor:pointer;font-weight:500}
.bar button:hover{background:rgba(255,255,255,.1)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px}.sync.idle{color:#8FE0B8}.sync.error,.sync.local{color:#FFB3BE}
.spin{width:11px;height:11px;border-radius:6px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp 700ms linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.wrap{max-width:1400px;margin:0 auto;padding:26px 28px 60px;display:flex;flex-direction:column;gap:22px}.wrap>*{min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}.head p{margin:4px 0 0;color:var(--muted);max-width:90ch}
.btn{min-height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--blue);background:#fff;color:var(--blue);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:14px}
.btn:hover{background:var(--blue-50)}.btn.p{background:var(--blue);color:#fff}.btn.p:hover{background:var(--blue-d)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{padding:14px 18px;border-right:1px solid var(--line)}.kpi:last-child{border-right:0}
.kpi span{display:block;font-size:12.5px;color:var(--muted);font-weight:500}.kpi b{font-size:26px;font-weight:600}.kpi b small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}.kpi em{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}
.kpi.red b{color:var(--red)}
.tbox{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tscroll{overflow-x:auto}
table.main{width:100%;border-collapse:collapse;min-width:1120px}
.main thead th{background:var(--blue-50);color:var(--navy);font-size:12.5px;font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--blue-100);white-space:nowrap}
.main thead th .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;margin-right:6px}
.main td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.prow{cursor:pointer;transition:background var(--fast)}tr.prow:hover{background:var(--row)}tr.prow.open{background:var(--blue-50)}
tr.prow.open td{border-bottom-color:transparent}
.pn{display:flex;align-items:center;gap:12px}.pn b{display:block;font-size:14.5px}.pn small{color:var(--muted);font-size:12px}
.lg{display:inline-flex;align-items:center;justify-content:center;width:88px;height:34px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 6px;flex-shrink:0}
.lg img{max-height:26px;max-width:76px}.lg .wm{font-weight:700;color:#005BA4;font-size:12px}.lg .wm span{color:#13294B}
.cell{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 9px;border-radius:13px;font-size:12.5px;font-weight:600;white-space:nowrap}
.cell.done{background:var(--blue);color:#fff}.cell.part{background:#fff;color:var(--blue);border:1px solid var(--blue)}.cell.none{color:var(--off);font-weight:500}
.cell.cur{box-shadow:0 0 0 3px var(--blue-100)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:4px;white-space:nowrap}
.st.ok{background:var(--blue-50);color:var(--blue-d)}.st.bad{background:var(--red-50);color:var(--red)}.st.live{background:var(--green-50);color:var(--green)}
.due{font-weight:600;white-space:nowrap}.due.late{color:var(--red)}
.chev{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;transition:transform var(--fast) var(--ease)}
tr.open .chev{transform:rotate(180deg);border-color:var(--blue);color:var(--blue)}
tr.drow td{background:var(--blue-50);padding:0 12px 16px;border-bottom:1px solid var(--blue-100)}
.dwrap{background:#fff;border:1px solid var(--blue-100);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:18px}
.dh{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted)}.dh b{color:var(--ink)}
.sgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sg{border-right:1px solid var(--line);display:flex;flex-direction:column}.sg:last-child{border-right:0}
.sg h4{margin:0;padding:9px 12px;background:var(--row);border-bottom:1px solid var(--line);font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:6px}
.sgb{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.seg2{display:flex;border:1px solid var(--blue);border-radius:6px;overflow:hidden}.seg2 button{flex:1;min-height:36px;border:0;background:#fff;color:var(--blue-d);font-weight:600;font-size:12.5px;cursor:pointer;padding:0 6px}
.seg2 button+button{border-left:1px solid var(--blue)}.seg2 button[aria-pressed="true"]{background:var(--blue);color:#fff}.sg:not(.done) .seg2 button[data-v="0"][aria-pressed="true"]{background:var(--blue-100);color:var(--navy)}
.duehint{margin:0;font-size:12.5px;color:var(--muted)}.dr{display:block;font-size:11.5px;color:var(--muted);font-weight:400;max-width:130px;line-height:1.3}
.cell.late{background:var(--red-50);color:var(--red);border:1px solid var(--red)}
.sg.od h4{background:var(--red);color:#fff}.odt{color:var(--red)}
.secp{margin:-4px 0 10px;color:var(--muted);font-size:13.5px}
.ctab{min-width:1180px}.ctab td{vertical-align:top}
.cno{min-height:30px;padding:0 12px;border-radius:15px;border:1px dashed var(--off);background:#fff;color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit}.cno:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-50)}
.cyes{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;font-size:12.5px;text-decoration:none;white-space:nowrap}a.cyes:hover{background:var(--blue-d);text-decoration:none}
.cmeta{font-size:11.5px;color:var(--muted);margin-top:4px}.cmeta .lnk{font-size:11.5px;min-height:22px}
.ced{display:flex;flex-direction:column;gap:6px;min-width:220px}.ced .btn.sm{width:auto}
.sdesc{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4}
button.cell{border:0;cursor:pointer;font-family:inherit}button.cell.none{background:none;color:var(--muted)}button.cell.none:hover,button.cell.part:hover{background:var(--blue-50)}button.cell.done:hover{background:var(--blue-d)}
.sg h4 small{color:var(--muted);font-weight:500}.sg.done h4{background:var(--blue);color:#fff}.sg.done h4 small{color:#D6EAF9}.sg.cur h4{background:var(--blue-100);color:var(--navy)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;cursor:pointer;font-size:13.5px;line-height:1.4;border-bottom:1px solid var(--line);min-height:44px}.ck:last-child{border-bottom:0}.ck:hover{background:var(--row)}
.ck input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--blue);flex-shrink:0;cursor:pointer}.ck.on span{color:var(--muted)}
.dgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.blk{display:flex;flex-direction:column;gap:10px}.blk h5{margin:0;font-size:13px;font-weight:600;color:var(--navy);text-transform:none}
.f{display:flex;flex-direction:column;gap:4px}.f label{font-size:12.5px;color:var(--muted);font-weight:500}
.inp{min-height:38px;padding:0 10px;border:1px solid var(--off);border-radius:6px;background:#fff;width:100%}
textarea.inp{padding:8px 10px;min-height:76px;resize:vertical}.inp:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-100)}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.tg{display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer;min-height:36px}
.switch{width:40px;height:22px;border-radius:11px;border:0;padding:0;background:var(--off);cursor:pointer;position:relative;flex-shrink:0;transition:background var(--fast)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:9px;background:#fff;transition:transform var(--fast) var(--ease)}
.switch[aria-checked="true"]{background:var(--red)}.switch[aria-checked="true"]::after{transform:translateX(18px)}
table.mini{width:100%;border-collapse:collapse;font-size:13px}.mini th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--row)}.mini td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.kl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kl a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:13.5px;min-height:40px}.kl a:last-child{border-bottom:0}.kl a:hover{background:var(--blue-50);color:var(--blue-d)}
.kl a span{font-size:11.5px;font-weight:600;color:var(--blue);border:1px solid var(--blue-100);border-radius:4px;padding:1px 6px}
.empty{color:var(--muted);font-size:13px;margin:0}
.sec h2{margin:0 0 10px;font-size:17px;font-weight:600}
table.log{width:100%;border-collapse:collapse;min-width:640px}.log th{text-align:left;font-size:12.5px;color:var(--navy);background:var(--blue-50);padding:9px 12px;font-weight:600}.log td{padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px}
.log td:first-child{white-space:nowrap;color:var(--muted);width:120px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:11px 16px;border-radius:6px;font-weight:500;opacity:0;transition:opacity var(--fast),transform var(--fast) var(--ease);z-index:40;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.gate{min-height:100vh;display:grid;place-items:center;background:linear-gradient(var(--navy) 0 38%,#F4F7FB 38%);padding:20px}
.gcard{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:10px;padding:30px 28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(11,36,71,.12)}
.gcard h1{margin:0;font-size:22px;font-weight:600}.gcard p{margin:0;color:var(--muted)}.gerr{background:var(--red-50);color:var(--red);border-radius:6px;padding:9px 12px;font-weight:500;font-size:13.5px}

.mgrid{display:grid;grid-template-columns:1.7fr 1fr;gap:18px}
.mbox{border:1px solid var(--blue-100);border-radius:8px;padding:16px;gap:12px}
.side2{display:flex;flex-direction:column;gap:16px}
.nextbar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--blue);color:#fff;border-radius:6px;padding:10px 14px}
.nextbar .nl{font-size:12px;font-weight:600;background:rgba(255,255,255,.18);border-radius:4px;padding:2px 8px}.nextbar b{font-size:15px}.nextbar span:last-child{color:#D6EAF9;font-size:13.5px}
.ups{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.up{display:grid;grid-template-columns:52px 1fr auto;gap:14px;padding:12px;border-bottom:1px solid var(--line);align-items:start}.up:last-child{border-bottom:0}
.upd{border:1px solid var(--blue-100);border-radius:6px;text-align:center;overflow:hidden}.upd small{display:block;background:var(--blue);color:#fff;font-size:11px;font-weight:600;padding:1px 0}.upd b{display:block;font-size:18px;padding:2px 0}
.up.late .upd small{background:var(--red)}.up.late em{color:var(--red);font-style:normal;font-weight:600}
.upi b{font-size:14.5px}.upi span{display:block;font-size:13px;color:var(--muted)}.upi p{margin:4px 0 0;font-size:13px}
.upa{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px;width:120px;justify-content:center}
.lnk{background:none;border:0;padding:2px 0;color:var(--blue);font-weight:600;font-size:13px;cursor:pointer;min-height:28px}.lnk:hover{text-decoration:underline}.lnk.red{color:var(--red)}
.inl{margin-top:10px;padding:12px;background:var(--row);border-radius:6px;display:flex;flex-direction:column;gap:10px}.ib{display:flex;gap:8px;flex-wrap:wrap}
.sugs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chip{min-height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--blue-100);background:#fff;color:var(--blue-d);font-weight:600;font-size:13px;cursor:pointer}.chip:hover{border-color:var(--blue)}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.sform{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--row)}
.sform .span2{grid-column:span 2}select.inp{appearance:auto}
.mtag{display:inline-block;font-size:11px;font-weight:600;color:var(--blue-d);background:var(--blue-50);border:1px solid var(--blue-100);border-radius:4px;padding:0 5px;margin-right:4px;vertical-align:1px}
td.lt{color:var(--red);font-weight:600}.muted{color:var(--muted)}
.inp:disabled{background:var(--row);color:var(--muted)}
@media (max-width:1100px){.mgrid{grid-template-columns:1fr}.sform{grid-template-columns:1fr 1fr}.up{grid-template-columns:52px 1fr}.upa{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center}}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))!important}.dgrid{grid-template-columns:1fr}.sgrid{grid-template-columns:1fr}.sg{border-right:0;border-bottom:1px solid var(--line)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:640px){.wrap,.bar .in{padding-left:14px;padding-right:14px}.head h1{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  try{await pull(true);try{localStorage.setItem('valimail-auth',JSON.stringify({name:ME,code:CODE}))}catch(x){}start()}catch(x){if(x.message!=='invalid_code')gate('Could not reach the tracker. Check your connection and try again.')}});

 return d.done?`<span class="cell done" title="${st.t}: ${st.yes}${d.date?' on '+dlong(d.date):''}">✓ ${st.yes}</span>`

const planned=p=>(p.meetings||[]).filter(m=>m.status==='planned').sort((a,b)=>(a.d+(a.time||'')).localeCompare(b.d+(b.time||'')));
const past=p=>(p.meetings||[]).filter(m=>m.status!=='planned'&&m.status!=='cancelled').sort((a,b)=>b.d.localeCompare(a.d));
const suggest=p=>{const s=stageOf(p);const list=MTYPES.filter(x=>x.st===s);return list.length?list:[MTYPES[6]]};
const t12=t=>{if(!t)return'';const[h,m]=t.split(':');const H=+h;return`${H%12||12}:${m} ${H<12?'AM':'PM'}`};
const dlong=d=>md(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
const GAP=[null,5,7,7,3],GAP_DONE=30;
const addTo=(d,n)=>{const x=md(d||today());x.setDate(x.getDate()+n);return`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
function lastDone(p){let best='';STAGES.forEach((st,i)=>{const d=p.s[st.k];if(d.done&&(d.date||'')>best)best=d.date});return best}
function autoDue(p){const s=stageOf(p);if(s===0)return null;if(s===5)return addTo(lastDone(p),GAP_DONE);const prev=p.s[STAGES[s-1].k].date||today();return addTo(prev,GAP[s])}
function dueReason(p){if(planned(p).length)return'Date of the next scheduled meeting';if(p.dueManual)return'Set by hand';const s=stageOf(p);if(s===0)return'Set by hand for the intro meeting';if(s===5)return`${GAP_DONE} days after the last step, for a check-in`;return`${GAP[s]} days after ${STAGES[s-1].t.toLowerCase()} ${STAGES[s-1].yes.toLowerCase()}`}
function stageDue(p,i){if(isDone(p,i))return null;if(i===0)return stageOf(p)===0?p.due:null;const pr=p.s[STAGES[i-1].k];if(!pr.done||!pr.date)return null;return addTo(pr.date,GAP[i])}
function overdue(p,i){const d=stageDue(p,i);if(!d||d>=today())return 0;return Math.round((md(today())-md(d))/864e5)}
function refreshDue(p){if(planned(p).length)return;if(p.dueManual)return;const a=autoDue(p);if(a)p.due=a}
function syncNext(p){const up=planned(p);if(up.length){const m=up[0];p.next=m.t;p.due=m.d;p.nextMeeting=m.id}
 else if(p.nextMeeting){p.nextMeeting=null;const sg=suggest(p)[0];p.next=live(p)?'Schedule a check-in':'Schedule the '+sg.t.toLowerCase();p.due=addDays(7);refreshDue(p)}}
function nextCell(p){const up=planned(p)[0];return up?`<span class="mtag">Meeting</span> ${esc(up.t)}${up.time?`<small class="muted"> · ${t12(up.time)}</small>`:''}`:esc(p.next)}
function draftFor(p,type){const x=mt(type);return{type:x.t,t:x.t==='Other'?'':x.t,d:addDays(3),time:'10:00',fmt:'Video call',who:'',agenda:x.t==='Other'?'':x.d}}
function detail(p){const s=stageOf(p),up=planned(p),pa=past(p),sg=suggest(p);if(!DRAFT||DRAFT.pid!==p.id)DRAFT=Object.assign(draftFor(p,sg[0].t),{pid:p.id});

</div>

function icsFor(p,m){const pad=n=>String(n).padStart(2,'0');const d=m.d.replace(/-/g,'');let dt;if(m.time){const[h,mi]=m.time.split(':');const e=new Date(`${m.d}T${m.time}:00`);e.setMinutes(e.getMinutes()+45);dt=`DTSTART:${d}T${h}${mi}00\r\nDTEND:${e.getFullYear()}${pad(e.getMonth()+1)}${pad(e.getDate())}T${pad(e.getHours())}${pad(e.getMinutes())}00`}else{const e=md(m.d);e.setDate(e.getDate()+1);dt=`DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${e.getFullYear()}${pad(e.getMonth()+1)}${pad(e.getDate())}`}
 const clean=x=>String(x||'').replace(/[\r\n]+/g,' ').replace(/[,;]/g,'\\$&');
 return`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//DMARC Essentials tracker//EN\r\nBEGIN:VEVENT\r\nUID:${m.id}@valimail.ssldemo.site\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z\r\n${dt}\r\nSUMMARY:${clean(p.name+': '+m.t)}\r\nDESCRIPTION:${clean([m.fmt,m.who&&'With '+m.who,m.agenda].filter(Boolean).join('. '))}\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`}

const CITEMS=[{k:'web',t:'Website product page',yes:'Live',no:'Not live',url:true},{k:'sheet',t:'Sales sheet sent to customers',yes:'Yes',no:'No'},
 {k:'e1',t:'Email 1',yes:'Sent',no:'Not sent'},{k:'e2',t:'Email 2',yes:'Sent',no:'Not sent'},{k:'e3',t:'Email 3',yes:'Sent',no:'Not sent'},{k:'e4',t:'Email 4',yes:'Sent',no:'Not sent'},

function cinit(p){if(!p.c)p.c={};CITEMS.forEach(x=>{if(!p.c[x.k])p.c[x.k]={done:false,date:'',url:''}});return p.c}
const safeUrl=u=>{u=(u||'').trim();if(!u||/\s/.test(u))return'';if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return/^https?:$/.test(x.protocol)&&/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(x.hostname)?x.href:''}catch(e){return''}};
function ccell(p,x){const c=cinit(p)[x.k];const ed=CED&&CED.p===p.id&&CED.k===x.k;
 if(ed)return`<div class="ced"><input class="inp" id="ced-in" type="url" inputmode="url" placeholder="${x.opt?'Link (optional)':'https://partner-site/page'}" value="${esc(c.url||'')}" aria-label="${esc(x.t)} link"><div class="ib"><button class="btn sm p" data-a="csave" data-p="${p.id}" data-k="${x.k}">Save</button><button class="btn sm" data-a="cclose">Cancel</button></div></div>`;
 if(c.done){const link=c.url?`<a class="cyes" href="${esc(c.url)}" target="_blank" rel="noopener" title="Open ${esc(c.url)}">✓ ${x.yes} ↗</a>`:`<span class="cyes">✓ ${x.yes}</span>`;
  return`<div class="cc">${link}<div class="cmeta">${c.date?mon(c.date)+' '+dom(c.date):''}${x.url?` · <button class="lnk" data-a="cedit" data-p="${p.id}" data-k="${x.k}">${c.url?'Edit link':'Add link'}</button>`:''} · <button class="lnk" data-a="cno" data-p="${p.id}" data-k="${x.k}">Set ${x.no.toLowerCase()}</button></div></div>`}
 return`<button class="cno" data-a="${x.url&&!x.opt?'cedit':'cyes'}" data-p="${p.id}" data-k="${x.k}" title="Mark ${x.yes.toLowerCase()}">${x.no}</button>`}
function contentSection(){const ps=S.partners;return`<section class="sec"><h2>Partner content launch</h2><p class="secp">What each partner has done with the kit. Click a “No” to switch it to yes; a live website becomes a link to the page.</p>
<div class="tbox"><div class="tscroll"><table class="main ctab"><thead><tr><th>Partner</th>${CITEMS.map(x=>`<th>${x.t}</th>`).join('')}<th>Done</th></tr></thead><tbody>
${ps.map(p=>{const c=cinit(p);const n=CITEMS.filter(x=>c[x.k].done).length;return`<tr><td><div class="pn">${logo(p)}<div><b>${esc(p.name)}</b></div></div></td>${CITEMS.map(x=>`<td>${ccell(p,x)}</td>`).join('')}<td><b>${n}</b>/${CITEMS.length}</td></tr>`}).join('')}
</tbody></table></div></div></section>`}
function upcomingAll(){return S.partners.flatMap(p=>planned(p).map(m=>({p,m}))).sort((a,b)=>(a.m.d+(a.m.time||'')).localeCompare(b.m.d+(b.m.time||'')))}
document.addEventListener('click',e=>{const t=e.target.closest('[data-row],[data-a]');if(!t)return;
 if(t.dataset.row&&!e.target.closest('.drow')){if(t.dataset.go){OPEN=t.dataset.row;render();document.querySelector(`tr.prow[data-row="${OPEN}"]`)?.scrollIntoView({block:'start',behavior:'smooth'});return}OPEN=OPEN===t.dataset.row?null:t.dataset.row;EXP=null;const y=window.scrollY;render();window.scrollTo(0,y);return}
 const a0=t.dataset.a;
 if(['cyes','cno','cedit','csave','cclose'].includes(a0)){const q=P(t.dataset.p||(CED&&CED.p));const k=t.dataset.k||(CED&&CED.k);const y0=window.scrollY;
  if(a0==='cclose'){CED=null;render();window.scrollTo(0,y0);return}
  const x=CITEMS.find(z=>z.k===k);const c=cinit(q)[k];
  if(a0==='cedit'){CED={p:q.id,k};render();window.scrollTo(0,y0);setTimeout(()=>document.getElementById('ced-in')?.focus(),20);return}
  if(a0==='csave'){const raw=document.getElementById('ced-in').value;const u=safeUrl(raw);if(raw.trim()&&!u){toast('That link does not look right. Check it and try again.');return}if(x.url&&!x.opt&&!u){toast('Add the page link to mark the website live');return}
   const was=c.done;c.url=u;if(!c.done){c.done=true;c.date=today()}CED=null;log(q,`${x.t}: ${was?'link updated':x.yes.toLowerCase()}${u?' ('+u+')':''}`);render();window.scrollTo(0,y0);toast(`${q.name}: ${x.t} ${was?'link saved':x.yes.toLowerCase()}`);return}
  if(a0==='cyes'){c.done=true;c.date=today();log(q,`${x.t}: ${x.yes.toLowerCase()}`);render();window.scrollTo(0,y0);toast(`${q.name}: ${x.t} ${x.yes.toLowerCase()}`);return}
  if(a0==='cno'){if(!confirm(`Set ${x.t} to ${x.no.toLowerCase()} for ${q.name}?`))return;c.done=false;c.date='';log(q,`${x.t}: ${x.no.toLowerCase()}`);render();window.scrollTo(0,y0);return}}
 if(a0==='tog'||a0==='set'){const q=P(t.dataset.p||OPEN);if(!q)return;const i=+t.dataset.i,st=STAGES[i],cur=q.s[st.k];const v=a0==='tog'?!cur.done:t.dataset.v==='1';if(v===!!cur.done)return;
  const before=stageOf(q);cur.done=v;cur.date=v?today():'';DRAFT=null;q.dueManual=false;refreshDue(q);if(!planned(q).length&&/^Schedule/i.test(q.next)&&stageOf(q)!==before){q.next=live(q)?'Schedule a check-in':'Schedule the '+suggest(q)[0].t.toLowerCase()}refreshDue(q);log(q,`${st.t}: ${(v?st.yes:st.no).toLowerCase()}`);const after=stageOf(q);const y=window.scrollY;render();window.scrollTo(0,y);
  toast(after===5?q.name+': all steps complete':`${q.name}: ${st.t} ${(v?st.yes:st.no).toLowerCase()}`);return}
 const p=P(OPEN),a=t.dataset.a;
 const rr=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};
 if(a==='mtype'&&p){DRAFT=Object.assign(draftFor(p,t.dataset.t),{pid:p.id,d:DRAFT.d,time:DRAFT.time,fmt:DRAFT.fmt,who:DRAFT.who});rr();document.getElementById('ms-d')?.focus();return}
 if(a==='autodue'&&p){p.dueManual=false;refreshDue(p);log(p,'due date set to automatic');rr();toast('Due date updated');return}
 if(a==='mmore'){document.getElementById('ms-type')?.focus();return}
 if(a==='msched'&&p){if(!DRAFT.t.trim()){toast('Add a title for the meeting');document.getElementById('ms-t').focus();return}if(!DRAFT.d){toast('Choose a date');document.getElementById('ms-d').focus();return}
  const m={id:'m'+Date.now(),type:DRAFT.type,t:DRAFT.t.trim(),d:DRAFT.d,time:DRAFT.time,fmt:DRAFT.fmt,who:DRAFT.who.trim(),agenda:DRAFT.agenda.trim(),status:'planned'};p.meetings.push(m);syncNext(p);
  log(p,`scheduled ${m.t} for ${dlong(m.d)}${m.time?', '+t12(m.time):''}`);DRAFT=null;rr();toast('Meeting scheduled');return}
 if(a==='mexp'){EXP={id:t.dataset.m,mode:t.dataset.mode};rr();setTimeout(()=>document.getElementById((EXP.mode==='done'?'oc-':'rd-')+EXP.id)?.focus(),30);return}
 if(a==='mclose'){EXP=null;rr();return}
 if(a==='mdone'&&p){const m=p.meetings.find(x=>x.id===t.dataset.m);if(!m)return;m.status='done';m.n=(document.getElementById('oc-'+m.id)?.value||'').trim();const x=mt(m.type);const tk=document.getElementById('tk-'+m.id);const before=stageOf(p);
  if(x.tick!==null&&tk&&tk.checked){const k=STAGES[x.tick].k;p.s[k].done=true;p.s[k].date=m.d}p.dueManual=false;syncNext(p);refreshDue(p);EXP=null;log(p,`completed ${m.t}`+(m.n?`: ${m.n}`:''));const after=stageOf(p);rr();toast(after!==before?(after===5?p.name+': all steps complete':p.name+': next is '+STAGES[after].t.toLowerCase()):'Meeting marked done');return}
 if(a==='mmove'&&p){const m=p.meetings.find(x=>x.id===t.dataset.m);const nd=document.getElementById('rd-'+m.id).value,nt=document.getElementById('rt-'+m.id).value;if(!nd){toast('Choose a date');return}m.d=nd;m.time=nt;syncNext(p);EXP=null;log(p,`rescheduled ${m.t} to ${dlong(nd)}${nt?', '+t12(nt):''}`);rr();toast('Meeting rescheduled');return}
 if(a==='mcancel'&&p){const m=p.meetings.find(x=>x.id===t.dataset.m);if(!confirm('Cancel '+m.t+'?'))return;m.status='cancelled';syncNext(p);log(p,'cancelled '+m.t);rr();toast('Meeting cancelled');return}
 if(a==='ics'&&p){const m=p.meetings.find(x=>x.id===t.dataset.m);const blob=new Blob([icsFor(p,m)],{type:'text/calendar'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=(p.name+' '+m.t).replace(/[^\w]+/g,'-')+'.ics';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
 if(a==='block'&&p){p.blocked=!p.blocked;if(!p.blocked){p.block='';log(p,'blocker cleared')}else log(p,'marked as blocked');rerender();if(p.blocked)setTimeout(()=>document.getElementById('bl')?.focus(),30)}
 else if(a==='copy'){const txt='DMARC Essentials partner launch, update\n\n'+summaryText()+'\n\n'+S.partners.map(q=>`${q.name}: ${STAGES.map((st,i)=>st.t+' '+(isDone(q,i)?st.yes:st.no).toLowerCase()).join(', ')}. Content: ${CITEMS.map(x=>x.t+' '+(cinit(q)[x.k].done?x.yes:x.no).toLowerCase()).join(', ')}${q.blocked?' (blocked: '+q.block+')':''}. Next: ${q.next} by ${mon(q.due)} ${dom(q.due)}.`).join('\n');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Update copied'),()=>toast('Copy is not available in this browser'))}
 else if(a==='signout'){localStorage.removeItem('valimail-auth');location.reload()}});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='ced-in'){if(e.key==='Enter'){e.preventDefault();document.querySelector('[data-a="csave"]')?.click()}if(e.key==='Escape'){CED=null;render()}return}if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr.prow')){e.preventDefault();OPEN=OPEN===e.target.dataset.row?null:e.target.dataset.row;render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.dr&&DRAFT){DRAFT[t.dataset.dr]=t.value}});
document.addEventListener('change',e=>{const t=e.target,p=P(OPEN);if(!p)return;
 if(t.dataset.sd!==undefined){const st=STAGES[+t.dataset.sd];p.s[st.k].date=t.value;refreshDue(p);log(p,`${st.t} date set to ${t.value?dlong(t.value):'none'}`);const y=window.scrollY;render();window.scrollTo(0,y);toast('Saved');return}
 if(t.dataset.dr){DRAFT[t.dataset.dr]=t.value;if(t.dataset.dr==='type'){const x=mt(t.value);if(!DRAFT.t||MTYPES.some(y=>y.t===DRAFT.t))DRAFT.t=x.t==='Other'?'':x.t;if(!DRAFT.agenda||MTYPES.some(y=>y.d===DRAFT.agenda))DRAFT.agenda=x.t==='Other'?'':x.d;const y=window.scrollY;render();window.scrollTo(0,y)}return}
 if(t.dataset.i!==undefined&&t.type==='checkbox'){const i=+t.dataset.i,j=+t.dataset.j,before=stageOf(p);p.checks[i][j]=t.checked;log(p,(t.checked?'done: ':'reopened: ')+STAGES[i].items[j].charAt(0).toLowerCase()+STAGES[i].items[j].slice(1));const after=stageOf(p);const y=window.scrollY;render();window.scrollTo(0,y);document.querySelector(`input[data-i="${i}"][data-j="${j}"]`)?.focus();if(after!==before)toast(after===5?p.name+' is onboarded and live':p.name+' moved to '+STAGES[after].t);return}
 if(t.dataset.k){const k=t.dataset.k;p[k]=t.value||(k==='due'?today():'');if(k==='due')p.dueManual=true;log(p,{next:'next action updated',due:'due date changed',block:'blocker updated',notes:'notes updated'}[k]);const y=window.scrollY;render();window.scrollTo(0,y);toast('Saved')}});

if(ME&&CODE){document.getElementById('app').innerHTML='<p class="empty" style="text-align:center;padding:80px 0">Loading the tracker…</p>';pull(true).then(start).catch(e=>{if(e.message!=='invalid_code')gate('Could not reach the tracker. Check your connection and try again.')})}else gate();
</script>
