<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DMARC Essentials Partner Launch Tracker</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%9B%A1%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F6F7FB;--surface:#FFFFFF;--ink:#101828;--muted:#475467;--line:#E4E7EE;--soft:#F1F3F8;--off:#D0D5DD;
--red:#D92D20;--red-soft:#FEF3F2;--green:#067647;
--c-bb:#2E6BE6;--t-bb:#EAF1FE;--c-pa:#D6246E;--t-pa:#FDEBF3;--c-irh:#B7791F;--t-irh:#FFF6E0;--c-bk:#0E9384;--t-bk:#E3F7F4;
--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);--ease:cubic-bezier(.2,.7,.2,1);--fast:160ms;
--display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;--body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1422;--surface:#161E31;--ink:#EAEEF6;--muted:#A5B0C4;--line:#27324A;--soft:#1D2740;--off:#3B4763;--red:#FF6B5E;--red-soft:#3B1F1D;--green:#4ADE9A;--t-bb:#1B2B55;--t-pa:#40182C;--t-irh:#3A2C12;--t-bk:#0F3530;--c-bb:#7DA6FF;--c-pa:#FF7AB0;--c-irh:#F2B544;--c-bk:#4FD1BF;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#0E1422;--surface:#161E31;--ink:#EAEEF6;--muted:#A5B0C4;--line:#27324A;--soft:#1D2740;--off:#3B4763;--red:#FF6B5E;--red-soft:#3B1F1D;--green:#4ADE9A;--t-bb:#1B2B55;--t-pa:#40182C;--t-irh:#3A2C12;--t-bk:#0F3530;--c-bb:#7DA6FF;--c-pa:#FF7AB0;--c-irh:#F2B544;--c-bk:#4FD1BF;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
html{overflow-x:hidden;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}a{color:var(--c);font-weight:600}
:focus-visible{outline:3px solid var(--c,#2E6BE6);outline-offset:2px;border-radius:8px}
.wrap{max-width:1360px;margin:0 auto;padding:28px 32px 64px;display:flex;flex-direction:column;gap:24px}.wrap>*{min-width:0}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
header p{margin:0 0 4px;color:var(--muted);font-size:14px}
header h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,3.4vw,44px);letter-spacing:-.03em;line-height:1.05}
header h1 .seg{display:inline-flex;gap:5px;vertical-align:middle;margin-left:14px}header h1 .seg i{width:14px;height:14px;border-radius:4px}
.hact{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.btn:hover{background:var(--soft)}.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.go:hover{filter:brightness(1.15)}
.sample{font-size:12px;font-weight:600;color:var(--muted);border:1px dashed var(--off);border-radius:999px;padding:4px 10px}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 22px;font-size:17px;line-height:1.55;box-shadow:var(--shadow)}
.brief b{font-family:var(--display);font-size:18px}
/* partner cards */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.pc{--c:#2E6BE6;--t:#EAF1FE;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow);transition:transform var(--fast) var(--ease),box-shadow var(--fast) var(--ease),border-color var(--fast) var(--ease);overflow:hidden}
.pc::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--c)}
.pc:hover{transform:translateY(-2px)}
.pc[aria-pressed="true"]{border:2px solid var(--c);padding:17px 17px 15px;background:linear-gradient(var(--t),var(--surface) 70%)}
.pc .r1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo-bg{display:inline-flex;background:#fff;border-radius:8px;padding:4px 7px;border:1px solid #EEF0F4}.logo{height:24px;width:auto;display:block}.logo.pa{height:30px}
.wordmark{font-weight:700;color:#005BA4;font-size:15px;background:#fff;border-radius:8px;padding:4px 7px;border:1px solid #EEF0F4}.wordmark span{color:#13294B}
.ring{width:58px;height:58px;border-radius:29px;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex-shrink:0;transition:background 500ms var(--ease)}
.ring span{width:44px;height:44px;border-radius:22px;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px}
.pc h2{margin:0;font-family:var(--display);font-size:22px;letter-spacing:-.02em;line-height:1.1}
.pc .mk{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.bars i{height:8px;border-radius:4px;background:var(--soft)}.bars i.d{background:var(--c)}.bars i.h{background:linear-gradient(90deg,var(--c) var(--h),var(--soft) var(--h))}
.stg{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}
.stg b{color:var(--c)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px}
.tag.blk{background:var(--red-soft);color:var(--red)}.tag.live{background:var(--t);color:var(--c)}
.nx{font-size:13.5px;line-height:1.4;display:flex;gap:8px;align-items:flex-start;padding-top:12px;border-top:1px solid var(--line)}
.due{flex-shrink:0;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--t);color:var(--c)}.due.late{background:var(--red-soft);color:var(--red)}
/* workspace */
.ws{--c:#2E6BE6;--t:#EAF1FE;display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
.ws-h{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 22px;border-radius:20px;background:var(--t);border:1px solid var(--line)}
.ws-h h2{margin:0;font-family:var(--display);font-size:28px;letter-spacing:-.02em}
.ws-h .meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--muted);flex:1;min-width:240px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);min-width:0}
.panel h3{margin:0;font-family:var(--display);font-size:20px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;gap:10px}.panel h3 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:600}
.steps{display:flex;flex-direction:column}
.stage{display:grid;grid-template-columns:40px 1fr;gap:14px;position:relative;padding-bottom:18px}
.stage:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.stage.done:not(:last-child)::before{background:var(--c)}
.badge{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;background:var(--soft);color:var(--muted);border:2px solid var(--line);z-index:1}
.stage.done .badge{background:var(--c);color:#fff;border-color:var(--c)}.stage.cur .badge{background:var(--surface);color:var(--c);border-color:var(--c);box-shadow:0 0 0 5px var(--t)}
.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:40px}.sh b{font-size:16.5px}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--muted)}.stage.done .st{background:var(--t);color:var(--c)}.stage.cur .st{background:var(--c);color:#fff}
.sd{font-size:13.5px;color:var(--muted);margin:0 0 8px}
.chk{display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 12px;border-radius:12px;cursor:pointer;transition:background var(--fast) var(--ease)}
.chk:hover{background:var(--soft)}
.chk input{appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--off);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.chk input:checked{background:var(--c);border-color:var(--c)}
.chk input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk.on span{color:var(--muted)}
.side{display:flex;flex-direction:column;gap:20px;min-width:0}
.f{display:flex;flex-direction:column;gap:6px}.f label{font-size:13px;font-weight:600;color:var(--muted)}
.in{min-height:44px;padding:0 12px;border:1px solid var(--off);border-radius:12px;background:var(--surface);width:100%}
textarea.in{padding:10px 12px;min-height:84px;resize:vertical}
.in:focus{border-color:var(--c);outline:none;box-shadow:0 0 0 3px var(--t)}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.swrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch{width:52px;height:30px;border-radius:15px;border:0;padding:0;background:var(--off);cursor:pointer;flex-shrink:0;position:relative;transition:background var(--fast) var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform var(--fast) var(--ease)}
.switch[aria-checked="true"]{background:var(--red)}.switch[aria-checked="true"]::after{transform:translateX(22px)}
.mt{display:flex;flex-direction:column}.mt div{padding:10px 0;border-bottom:1px solid var(--line)}.mt div:last-child{border:0}.mt b{font-size:14.5px}.mt span{font-size:13px;color:var(--muted);margin-left:8px}.mt p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.kit{display:flex;flex-wrap:wrap;gap:8px}.kit button{min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;cursor:pointer}.kit button:hover{border-color:var(--c);color:var(--c)}
.lower{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ag{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.ag:last-child{border:0}
.cal{border-radius:12px;text-align:center;overflow:hidden;background:var(--t)}.cal small{display:block;background:var(--c);color:#fff;font-size:11px;font-weight:700;padding:2px 0}.cal b{display:block;font-family:var(--display);font-size:20px;padding:1px 0 3px;color:var(--c)}
.cal.late{--c:var(--red);--t:var(--red-soft)}
.ag .t{font-size:14.5px;line-height:1.4}.ag .t span{display:block;color:var(--muted);font-size:13px}
.link{background:none;border:0;color:var(--c);font-weight:700;cursor:pointer;min-height:36px;padding:0 6px}
.feed div{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}.feed div:last-child{border:0}
.feed .d{width:84px;flex-shrink:0;color:var(--muted);font-size:13px}.feed .dot{width:8px;height:8px;border-radius:4px;flex-shrink:0;background:var(--c);align-self:center}
.foot{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}.foot button{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font-weight:600;cursor:pointer;min-height:32px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;transition:opacity var(--fast),transform var(--fast) var(--ease);z-index:40;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.bb{--c:var(--c-bb);--t:var(--t-bb)}.pa{--c:var(--c-pa);--t:var(--t-pa)}.irh{--c:var(--c-irh);--t:var(--t-irh)}.bk{--c:var(--c-bk);--t:var(--t-bk)}
.sync{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.sync.idle{color:var(--green)}.sync.error,.sync.local{color:var(--red);background:var(--red-soft);border-color:transparent}
.spin{width:12px;height:12px;border-radius:6px;border:2px solid var(--off);border-top-color:var(--ink);animation:sp 700ms linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.empty{margin:0;color:var(--muted);font-size:14px}.feed .by{color:var(--muted);font-size:13px}
.gate{min-height:80vh;display:grid;place-items:center}.gcard{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px 28px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.gcard h1{margin:0;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em}.gcard p{margin:0;color:var(--muted)}.gcard .seg{display:flex;gap:5px}.gcard .seg i{width:14px;height:14px;border-radius:4px}
.gerr{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.gcard .in:focus{border-color:var(--c-bb);box-shadow:0 0 0 3px var(--t-bb)}
@media (max-width:1150px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.ws,.lower{grid-template-columns:1fr}}
@media (max-width:620px){.wrap{padding:16px 12px 48px}.cards{grid-template-columns:1fr}.panel{padding:18px 16px}.g2{grid-template-columns:1fr}header h1 .seg{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

${workspace(sel)}
<div class="lower">
<section class="panel"><h3>Coming up</h3><div>${[...ps].sort((a,b)=>a.due.localeCompare(b.due)).map(p=>`<div class="ag ${p.id}"><div class="cal ${late(p.due)?'late':''}"><small>${mon(p.due)}</small><b>${dom(p.due)}</b></div><div class="t">${esc(p.next)}<span>${esc(p.name)}${late(p.due)?', overdue':''}</span></div><button class="link" data-sel="${p.id}">Open</button></div>`).join('')}</div></section>
<section class="panel"><h3>Recent activity</h3><div class="feed">${S.log.length?S.log.slice(0,8).map(l=>`<div class="${l.p}"><span class="dot"></span><span class="d">${fmt(l.t)}</span><span><b>${esc(P(l.p).name)}</b> ${esc(l.x)}${l.by?`<span class="by"> · ${esc(l.by)}</span>`:''}</span></div>`).join(''):'<p class="empty">Nothing yet. Every step you tick, meeting you log or note you edit shows up here.</p>'}</div></section>
</div>
<div class="foot"><span>Signed in as <b>${esc(ME||'')}</b>${LOCAL?'. The shared database is not set up yet, so changes stay in this browser.':'. Changes save automatically and your manager sees them within seconds.'}</span><button data-a="signout">Sign out</button><button data-a="theme">Switch light or dark</button></div>`}
function workspace(p){const s=stageOf(p);
return`<section class="ws ${p.id}" aria-label="${esc(p.name)} workspace">
<div class="ws-h">${logo(p)}<h2>${esc(p.name)}</h2><div class="meta"><span>Partner ID ${p.pid}</span><span>${esc(p.legal)}</span><span>${esc(p.site)}</span><span>${esc(p.contact)}</span></div></div>
<div class="panel"><h3>Launch steps<small>Tick a step when it is done. The stage updates on its own.</small></h3><div class="steps">
${STAGES.map((st,i)=>{const c=p.checks[i],d=c.filter(Boolean).length,dn=d===c.length,cur=i===s;return`<div class="stage ${dn?'done':cur?'cur':''}"><span class="badge">${dn?'✓':i+1}</span><div>
<div class="sh"><b>${st.t}</b><span class="st">${dn?'Done':cur?'Current stage':'Up next'}</span><span class="st" style="background:none;padding:0">${d} of ${c.length}</span></div>
<p class="sd">${st.d}</p>${st.items.map((it,j)=>`<label class="chk ${c[j]?'on':''}"><input type="checkbox" data-i="${i}" data-j="${j}" ${c[j]?'checked':''}><span>${esc(it)}</span></label>`).join('')}</div></div>`}).join('')}
</div></div>
<div class="side">
<div class="panel"><h3>Next action</h3><div class="g2"><div class="f"><label for="nx">What happens next</label><input class="in" id="nx" data-k="next" value="${esc(p.next)}"></div><div class="f"><label for="du">Due</label><input class="in" id="du" type="date" data-k="due" value="${p.due}"></div></div></div>
<div class="panel"><div class="swrow"><h3>Blocked</h3><button class="switch" role="switch" aria-checked="${p.blocked}" aria-label="${esc(p.name)} is blocked" data-a="block"></button></div>
${p.blocked?`<div class="f"><label for="bl">What is blocking them?</label><input class="in" id="bl" data-k="block" value="${esc(p.block)}" placeholder="For example: waiting for legal approval"></div>`:`<span style="font-size:14px;color:var(--muted)">Switch on if something is stopping progress.</span>`}</div>
<div class="panel"><h3>Meetings<small>${p.meetings.length} logged</small></h3>
<div class="g2"><div class="f"><label for="mt">Meeting</label><input class="in" id="mt" placeholder="For example: Kit review"></div><div class="f"><label for="mdt">Date</label><input class="in" id="mdt" type="date" value="${today()}"></div></div>
<div class="f"><label for="mn">Outcome</label><input class="in" id="mn" placeholder="What was agreed?"></div>
<button class="btn" data-a="meet" style="align-self:flex-start">Log meeting</button>
<div class="mt">${p.meetings.length?'':'<p class="empty">No meetings logged yet.</p>'}${p.meetings.map(m=>`<div><b>${esc(m.t)}</b><span>${md(m.d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>${m.n?`<p>${esc(m.n)}</p>`:''}</div>`).join('')}</div></div>
<div class="panel"><h3>Notes</h3><textarea class="in" data-k="notes" aria-label="Notes about ${esc(p.name)}">${esc(p.notes)}</textarea></div>
<div class="panel"><h3>Kit files</h3><div class="kit">${KIT.map(k=>`<button data-a="file" data-x="${esc(p.name+' '+k)}">${k}</button>`).join('')}</div></div>
</div></section>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-sel],[data-a]');if(!t)return;
if(t.dataset.sel){const changed=S.sel!==t.dataset.sel;S.sel=t.dataset.sel;save();render();if(changed&&t.classList.contains('link'))document.querySelector('.ws').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return}
const p=P(S.sel),a=t.dataset.a;
if(a==='block'){p.blocked=!p.blocked;if(!p.blocked){p.block='';log(p,'blocker cleared')}else log(p,'marked as blocked');render();if(p.blocked)setTimeout(()=>$('#bl')?.focus(),30)}
else if(a==='meet'){const tt=$('#mt').value.trim();if(!tt){toast('Name the meeting first');$('#mt').focus();return}p.meetings.unshift({d:$('#mdt').value||today(),t:tt,n:$('#mn').value.trim()});p.meetings.sort((x,y)=>y.d.localeCompare(x.d));log(p,'logged a meeting: '+tt);render();toast('Meeting logged')}
else if(a==='copy'){const txt='DMARC Essentials partner launch, update\n\n'+S.partners.map(q=>`${q.name}: ${stageLabel(q)}${q.blocked?' (blocked: '+q.block+')':''}. Next: ${q.next} by ${mon(q.due)} ${dom(q.due)}.`).join('\n');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Update copied'),()=>toast('Copy is not available in this browser'))}
else if(a==='file')toast(t.dataset.x+' opens here in the full build');
else if(a==='signout'){localStorage.removeItem('valimail-auth');location.reload()}
else if(a==='theme'){const d=document.documentElement;const cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem('dmarc-theme',d.dataset.theme)}catch(e){}}});
document.addEventListener('change',e=>{const t=e.target,p=P(S.sel);
if(t.dataset.i!==undefined){const i=+t.dataset.i,j=+t.dataset.j,before=stageOf(p);p.checks[i][j]=t.checked;log(p,(t.checked?'done: ':'reopened: ')+STAGES[i].items[j].charAt(0).toLowerCase()+STAGES[i].items[j].slice(1));const after=stageOf(p);
const y=window.scrollY;render();window.scrollTo(0,y);document.querySelector(`input[data-i="${i}"][data-j="${j}"]`)?.focus();
if(after!==before)toast(after===5?p.name+' is onboarded and live':p.name+' moved to '+STAGES[after].t);return}
if(t.dataset.k){const k=t.dataset.k;p[k]=t.value||(k==='due'?today():'');log(p,{next:'next action updated',due:'due date changed',block:'blocker updated',notes:'notes updated'}[k]);const y=window.scrollY;render();window.scrollTo(0,y);toast('Saved')}});
try{const th=localStorage.getItem('dmarc-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
if(ME&&CODE){document.getElementById('app').innerHTML='<p class="empty" style="text-align:center;padding:80px 0">Loading the tracker…</p>';pull(true).then(start).catch(e=>{if(e.message!=='invalid_code')gate('Could not reach the tracker. Check your connection and try again.')})}else gate();
</script>
</body>
</html>
